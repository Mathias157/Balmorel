[workspace]
authors = ["mathias157 <mathiasros@proton.me>"]
channels = ["conda-forge"]
name = "BALMOREL"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
analyse = "python analysis/analyse.py "
verify = "python analysis/verify.py "
sync-down = { cmd = "rsync -avzu --filter=':- .gitignore' mberos@login2.hpc.dtu.dk:/work3/mberos/seconoff/ .", description = "Syncs repository to local, including .git folder, but without gitignored files" }
sync-up = { cmd = "rsync -avzu --filter=':- .gitignore'  ./ mberos@login2.hpc.dtu.dk:/work3/mberos/seconoff", description = "Syncs repository to remote, including .git folder, but without gitignored files" }
sync-plots = { cmd = "rsync -avzu mberos@login2.hpc.dtu.dk:'/work3/mberos/seconoff/analysis/plots/*' analysis/plots/", description = "Download everything from analysis/plots"}
sync-output = { cmd = "rsync -avzu mberos@login2.hpc.dtu.dk:'/work3/mberos/seconoff/analysis/output/*' analysis/output/", description = "Download everything from analysis/output"}

[tasks.sync-mainresults]
args = ["scenario", {arg="suffix", default="*"}]
cmd = "rsync -avzu mberos@login2.hpc.dtu.dk:'/work3/mberos/seconoff/{{ scenario }}/model/MainResults{{ suffix }}.gdx' {{ scenario }}/model/"
description = "Get MainResults from a scenario folder (first arg) with a certain suffix (second arg, defaults to *)"

[dependencies]
premailer = ">=3.10.0,<4"
click = ">=8.3.1,<9"
python-decouple = ">=3.8,<4"
python = ">=3.14.3,<3.15"
matplotlib = ">=3.10.8,<4"
pandas = ">=3.0.1,<4"
numpy = ">=2.4.3,<3"

[pypi-dependencies]
pybalmorel = ">=1.1.6, <2"
tsam = ">=2.3.9, <3"
ripgrepy = ">=2.2.0, <3"
